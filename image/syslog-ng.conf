@version: 4.7
@include "scl.conf"

options {
    keep-hostname(yes);
    use_dns(no);
    dns-cache(no);
    # Force UTC so $ISODATE matches the "date -u" cutoff in trim-old.sh
    # exactly (otherwise a timezone offset between the two)
    time-zone("UTC");
    ts-format(iso);
};

source s_network {
    # flags(syslog-protocol) makes network() accept BOTH legacy BSD-syslog
    # (RFC 3164 - Cisco IOS/IOS-XE, most network gear) AND IETF syslog
    # (RFC 5424 - modern Linux/Docker senders) on the same port, with
    # correct $HOST extraction either way. Without this flag, network()
    # only expects RFC 3164 and silently mis-parses RFC 5424 messages
    # (falls back to the peer IP for $HOST, dumps the rest into $MSG).
    network(transport("udp") port(514) flags(syslog-protocol));
    network(transport("tcp") port(514) flags(syslog-protocol));
};

# ${HOST} is substituted at runtime with the reporting hostname ->
# one file per host, no manual maintenance needed.
# ISODATE at the start of each line makes the files lexically sortable
# by time, which trim-old.sh relies on for retention.
destination d_perhost {
    file("/var/log/hosts/${HOST}.log"
         template("$ISODATE $HOST $MSGHDR$MSG\n")
         template-escape(no)
         create-dirs(yes));
};

log { source(s_network); destination(d_perhost); };
