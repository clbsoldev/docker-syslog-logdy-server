@version: 4.7
@include "scl.conf"

options {
    keep-hostname(yes);
    use_dns(no);
    dns-cache(no);
    # These are two separate things, not one:
    # recv-time-zone: assumed zone for messages WITHOUT their own timezone
    # (RFC 3164 - Cisco IOS/IOS-XE, most network gear). Must match where
    # those devices actually live, or their timestamps get silently
    # mis-shifted by the DST/UTC offset. Adjust if a device lives elsewhere.
    recv-time-zone("Europe/Berlin");
    # send-time-zone: zone used when WRITING timestamps to destinations.
    # Keeping this UTC is what makes $ISODATE match the "date -u" cutoff
    # in trim-old.sh - this one actually does need to be UTC.
    send-time-zone("UTC");
    ts-format(iso);
};

source s_network {
    # flags(syslog-protocol) makes network() accept BOTH legacy BSD-syslog
    # (RFC 3164 - Cisco IOS/IOS-XE, most network gear) AND IETF syslog
    # (RFC 5424 - modern Linux/Docker senders) on the same port, with
    # correct $HOST extraction either way. Without this flag, network()
    # only expects RFC 3164 and silently mis-parses RFC 5424 messages
    # (falls back to the peer IP for $HOST, dumps the rest into $MSG).
    network(transport("udp") port(514) flags(syslog-protocol));
    network(transport("tcp") port(514) flags(syslog-protocol));
};

# RFC 5424 requires a UTF-8 BOM (bytes EF BB BF) at the start of MSG when
# the content is UTF-8 - Cisco's rfc5424 output follows this correctly, but
# it then shows up literally in our output files unless stripped here.
# UNVERIFIED against a live instance - test and adjust the regex if it
# doesn't strip cleanly.
rewrite r_strip_bom {
    subst("^\xEF\xBB\xBF", "", value("MSG"));
};

# ${HOST} is substituted at runtime with the reporting hostname ->
# one file per host, no manual maintenance needed.
# ISODATE at the start of each line makes the files lexically sortable
# by time, which trim-old.sh relies on for retention.
destination d_perhost {
    file("/var/log/hosts/${HOST}.log"
         template("$ISODATE $HOST $MSGHDR$MSG\n")
         template-escape(no)
         create-dirs(yes));
};

log { source(s_network); rewrite(r_strip_bom); destination(d_perhost); };
